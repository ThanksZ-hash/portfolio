<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>한/영 번역기</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .header img { width: 44px; height: 44px; border-radius: 12px; }
  .header h1 { font-size: 20px; margin: 0; color: #1f2937; }
  .header-titles { display: flex; align-items: center; gap: 8px; flex: 1; }

  .pro-badge {
    display: none;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    padding: 3px 8px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .pro-badge.show { display: inline-block; }

  .auth-area { font-size: 13px; }
  .auth-area a, .auth-area button {
    color: #6d28d9;
    text-decoration: none;
    background: none;
    border: none;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }

  .direction-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  select {
    flex: 1;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
  }
  #swapBtn {
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    background: #ede9fe;
    color: #6d28d9;
    cursor: pointer;
    transition: background 0.15s;
  }
  #swapBtn:hover { background: #ddd6fe; }

  textarea {
    width: 100%;
    height: 130px;
    font-size: 15px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #8b5cf6; background: #fff; }

  #translateBtn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 13px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  #translateBtn:hover { opacity: 0.9; }

  #result {
    white-space: pre-wrap;
    border-radius: 12px;
    background: #f5f3ff;
    padding: 16px;
    margin-top: 16px;
    min-height: 60px;
    font-size: 15px;
    color: #1f2937;
    line-height: 1.5;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 16px;
    padding: 28px;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  }
  .modal-box p {
    color: #1f2937;
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 20px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-actions button {
    flex: 1;
    padding: 11px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #signupBtn {
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
  }
  #closeModalBtn {
    color: #6b7280;
    background: #f3f4f6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="assets/logo.svg" alt="로고">
      <div class="header-titles">
        <h1>한/영 번역기</h1>
        <span class="pro-badge" id="proBadge">PRO</span>
      </div>
      <div class="auth-area" id="authArea"></div>
    </div>

    <div class="direction-row">
      <select id="direction">
        <option value="ko2en">한국어 → English</option>
        <option value="en2ko">English → 한국어</option>
      </select>
      <button id="swapBtn" type="button">⇄ 전환</button>
    </div>

    <textarea id="inputText" placeholder="번역할 텍스트를 입력하세요"></textarea>
    <button id="translateBtn">번역하기</button>

    <div id="result"></div>
  </div>

  <div class="modal-overlay" id="limitModal">
    <div class="modal-box">
      <p>무료 이용은 1000자까지 지원됩니다.<br>더 긴 텍스트를 번역하려면 회원가입 후 유료 플랜으로 전환해주세요.</p>
      <div class="modal-actions">
        <button id="signupBtn" type="button">회원가입</button>
        <button id="closeModalBtn" type="button">종료</button>
      </div>
    </div>
  </div>

  <script>
    const MAX_LENGTH = 1000;
    const limitModal = document.getElementById("limitModal");
    let isLoggedIn = false;

    async function refreshAuth() {
      const authArea = document.getElementById("authArea");
      const proBadge = document.getElementById("proBadge");

      const res = await fetch("/api/me");
      const data = await res.json();
      isLoggedIn = data.loggedIn;

      if (data.loggedIn) {
        proBadge.classList.add("show");
        authArea.innerHTML = `${data.name}님 <button id="logoutBtn" type="button">로그아웃</button>`;
        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await fetch("/api/logout", { method: "POST" });
          refreshAuth();
        });
      } else {
        proBadge.classList.remove("show");
        authArea.innerHTML = `<a href="/login">로그인</a>`;
      }
    }

    refreshAuth();

    document.getElementById("swapBtn").addEventListener("click", () => {
      const directionEl = document.getElementById("direction");
      directionEl.value = directionEl.value === "ko2en" ? "en2ko" : "ko2en";
    });

    document.getElementById("signupBtn").addEventListener("click", () => {
      window.location.href = "/signup";
    });

    document.getElementById("closeModalBtn").addEventListener("click", () => {
      limitModal.classList.remove("open");
    });

    async function translate() {
      const text = document.getElementById("inputText").value.trim();
      const direction = document.getElementById("direction").value;
      const resultEl = document.getElementById("result");

      if (!text) return;

      if (!isLoggedIn && text.length > MAX_LENGTH) {
        limitModal.classList.add("open");
        return;
      }

      resultEl.textContent = "번역 중...";

      try {
        const res = await fetch("/api/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, direction }),
        });
        const data = await res.json();
        resultEl.textContent = data.result ?? JSON.stringify(data);
      } catch (err) {
        resultEl.textContent = "오류: " + err.message;
      }
    }

    document.getElementById("translateBtn").addEventListener("click", translate);
  </script>
</body>
</html>
