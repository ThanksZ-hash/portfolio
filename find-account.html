<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>아이디/비밀번호 찾기</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }
  h1 { font-size: 20px; margin: 0 0 8px; color: #1f2937; }
  p.desc { font-size: 13px; color: #6b7280; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: #6b7280; margin: 14px 0 6px; }
  input {
    width: 100%;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
  }
  input:focus { outline: none; border-color: #8b5cf6; background: #fff; }
  button {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    cursor: pointer;
  }
  #message { margin-top: 14px; font-size: 14px; color: #1f2937; white-space: pre-wrap; }
  .login-link { margin-top: 16px; font-size: 13px; text-align: center; }
  .login-link a { color: #6d28d9; text-decoration: none; }
  .step { display: none; }
  .step.active { display: block; }
</style>
</head>
<body>
  <div class="card">
    <h1>아이디/비밀번호 찾기</h1>
    <p class="desc">가입 시 등록한 이메일과 휴대폰 번호로 본인 확인 후 비밀번호를 재설정할 수 있습니다.</p>

    <div class="step active" id="step1">
      <label for="email">이메일</label>
      <input id="email" type="email" placeholder="you@example.com">

      <label for="phone">휴대폰 번호</label>
      <input id="phone" type="tel" placeholder="010-0000-0000">

      <button id="findBtn" type="button">본인 확인</button>
    </div>

    <div class="step" id="step2">
      <label for="code">인증번호</label>
      <input id="code" type="text" placeholder="인증번호 입력">

      <label for="newPassword">새 비밀번호</label>
      <input id="newPassword" type="password" placeholder="새 비밀번호">

      <label for="newPasswordConfirm">새 비밀번호 확인</label>
      <input id="newPasswordConfirm" type="password" placeholder="새 비밀번호 확인">

      <button id="resetBtn" type="button">비밀번호 재설정</button>
    </div>

    <div id="message"></div>
    <div class="login-link"><a href="/login">로그인으로 돌아가기</a></div>
  </div>

  <script>
    document.getElementById("findBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const messageEl = document.getElementById("message");

      if (!email || !phone) {
        messageEl.textContent = "이메일과 휴대폰 번호를 입력해주세요.";
        return;
      }

      const res = await fetch("/api/find-account", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, phone }),
      });
      const data = await res.json();

      if (data.found) {
        document.getElementById("step1").classList.remove("active");
        document.getElementById("step2").classList.add("active");
        // 실제 SMS 연동 전까지는 화면에 인증번호를 바로 보여주는 모의 인증입니다.
        messageEl.textContent = `${data.name}님, 계정을 찾았습니다.\n[모의 인증] 인증번호: ${data.code}`;
      } else {
        messageEl.textContent = data.error ?? "일치하는 계정을 찾을 수 없습니다.";
      }
    });

    document.getElementById("resetBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const code = document.getElementById("code").value.trim();
      const newPassword = document.getElementById("newPassword").value;
      const newPasswordConfirm = document.getElementById("newPasswordConfirm").value;
      const messageEl = document.getElementById("message");

      if (!code || !newPassword) {
        messageEl.textContent = "인증번호와 새 비밀번호를 입력해주세요.";
        return;
      }
      if (newPassword !== newPasswordConfirm) {
        messageEl.textContent = "비밀번호가 일치하지 않습니다.";
        return;
      }

      const res = await fetch("/api/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, phone, code, new_password: newPassword }),
      });
      const data = await res.json();

      if (data.success) {
        messageEl.textContent = "비밀번호가 재설정되었습니다. 로그인 페이지로 이동합니다...";
        setTimeout(() => { window.location.href = "/login"; }, 1000);
      } else {
        messageEl.textContent = data.error ?? "비밀번호 재설정에 실패했습니다.";
      }
    });
  </script>
</body>
</html>
